
name: CI/CD - Deploy BARISTA Landing Page

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build and Validate BARISTA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate website files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "All BARISTA website files are available."

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload BARISTA website files
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    name: Deploy BARISTA to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
